[package]
name = "ramwho"
version = "0.1.0"
edition = "2024"
description = "A fast, good-looking terminal process monitor that shows which apps really use your RAM"
license = "MIT"
repository = "https://github.com/giladashubham/ramwho"
readme = "README.md"
keywords = ["tui", "process", "memory", "monitor", "htop"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = "0.40.0"
